name: OpsWeek Quality Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check src/index.js
          node --check src/utils/dates.js
          node --check src/news/collect.js
          node --check src/ai/analyze.js
          node --check src/design/art-direction.js
          node --check src/design/layout-engine.js
          node --check src/design/visual-assets.js
          node --check src/newsletter/render.js
          node --check src/email/send.js
          node --check src/site/build.js
      - name: Run tests
        run: npm test
